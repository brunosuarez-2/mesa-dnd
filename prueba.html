<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa D&D — Prueba de conexión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="estilos.css">
<style>
  main { max-width:540px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:2rem; color:var(--manuscrito); display:flex; align-items:center; gap:10px; }
  p.sub { color:var(--texto-madera-suave); margin:6px 0 20px; }
  .card { color:var(--tinta); margin-bottom:14px; padding:16px; border-radius:2px;
    background:var(--fibras), linear-gradient(180deg, var(--manuscrito), var(--pergamino)); box-shadow:var(--sombra-papel); }
  .card h2 { font-size:1.35rem; margin:0 0 10px; }
  .row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(89,65,47,.25); font-size:.95rem; }
  .ok { color:var(--bosque); font-weight:600; } .err { color:var(--borgona); font-weight:600; } .mut { color:var(--tinta-suave); }
  #msg { color:var(--texto-madera); }
  button { width:100%; margin:6px 0; }
  code { display:block; background:rgba(51,39,29,.08); border:1px dashed rgba(51,39,29,.4); padding:10px; border-radius:2px; word-break:break-all; font-size:.9rem; margin:8px 0; }
  .hidden { display:none; }
</style>
</head>
<body>
<script src="ui.js"></script>
<main>
  <h1><svg class="ico" aria-hidden="true"><use href="#i-dado"/></svg>Prueba de conexión</h1>
  <p class="sub">Comprueba que Firebase está bien configurado. <a href="index.html" style="color:var(--oro)">Volver al inicio</a></p>

  <div class="card">
    <h2>1. Estado</h2>
    <div class="row"><span>Configuración</span><span id="st-config" class="mut">…</span></div>
    <div class="row"><span>Sesión</span><span id="st-auth" class="mut">sin iniciar</span></div>
    <div class="row"><span>Base de datos</span><span id="st-db" class="mut">sin probar</span></div>
  </div>

  <div class="card" id="login">
    <h2>2. Entrar</h2>
    <button class="btn laton" id="btn-dm">Entrar como DM (Google)</button>
    <button class="btn" id="btn-pj">Entrar como jugador (anónimo)</button>
  </div>

  <div class="card hidden" id="info">
    <h2>3. Tu ID de usuario</h2>
    <p class="mut" id="tipo"></p>
    <code id="uid"></code>
    <button class="btn tinta" id="btn-copy">Copiar ID</button>
    <button class="btn tinta" id="btn-test">Probar base de datos</button>
    <button class="btn tinta" id="btn-out">Cerrar sesión</button>
  </div>

  <p class="mut" id="msg"></p>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
  import { firebaseConfig } from "./config.js";

  const $ = id => document.getElementById(id);
  const setSt = (id, text, cls) => { $(id).textContent = text; $(id).className = cls; };
  const msg = t => { $("msg").textContent = t; };

  const configOk = Object.values(firebaseConfig).every(v => v && !String(v).includes("PEGA_AQUI"));
  if (!configOk) {
    setSt("st-config", "faltan datos en config.js", "err");
    msg("Abre config.js y reemplaza todos los PEGA_AQUI con los datos de Firebase.");
  } else {
    setSt("st-config", "OK", "ok");
  }

  let auth, db;
  try {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);
  } catch (e) {
    setSt("st-config", "error", "err");
    msg("Error al iniciar Firebase: " + e.message);
  }

  const explain = e => {
    const c = e.code || "";
    if (c.includes("operation-not-allowed")) return "Ese método de inicio de sesión no está activado (guía, paso A3).";
    if (c.includes("unauthorized-domain")) return "Falta autorizar este dominio en Firebase (guía, paso B4).";
    if (c.includes("popup-blocked")) return "El navegador bloqueó la ventana emergente. Permite pop-ups e inténtalo de nuevo.";
    if (c.includes("popup-closed")) return "Cerraste la ventana antes de terminar.";
    if (c.includes("PERMISSION_DENIED") || String(e.message).includes("Permission denied"))
      return "Permiso denegado: faltan las reglas de prueba en Realtime Database → Reglas.";
    return (c ? c + ": " : "") + e.message;
  };

  $("btn-dm").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); msg(""); }
    catch (e) { msg(explain(e)); }
  };
  $("btn-pj").onclick = async () => {
    try { await signInAnonymously(auth); msg(""); }
    catch (e) { msg(explain(e)); }
  };
  $("btn-out").onclick = () => signOut(auth);
  $("btn-copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("uid").textContent); msg("ID copiado."); }
    catch { msg("No se pudo copiar automáticamente: selecciona el ID y cópialo a mano."); }
  };
  $("btn-test").onclick = async () => {
    const u = auth.currentUser;
    if (!u) return;
    setSt("st-db", "probando…", "mut");
    try {
      const r = ref(db, "pruebas/" + u.uid);
      const stamp = new Date().toISOString();
      await set(r, { hora: stamp });
      const snap = await get(r);
      if (snap.val()?.hora === stamp) { setSt("st-db", "OK — lee y escribe", "ok"); msg("¡Todo conectado!"); }
      else { setSt("st-db", "respuesta inesperada", "err"); }
    } catch (e) {
      setSt("st-db", "error", "err");
      msg(explain(e));
    }
  };

  if (auth) onAuthStateChanged(auth, user => {
    if (user) {
      setSt("st-auth", user.isAnonymous ? "jugador (anónimo)" : "DM (Google)", "ok");
      $("tipo").textContent = user.isAnonymous
        ? "Sesión de jugador anónimo. Este ID cambia si cierras sesión."
        : "Sesión de DM. Este es el ID que necesito para las reglas definitivas.";
      $("uid").textContent = user.uid;
      $("login").classList.add("hidden");
      $("info").classList.remove("hidden");
    } else {
      setSt("st-auth", "sin iniciar", "mut");
      setSt("st-db", "sin probar", "mut");
      $("login").classList.remove("hidden");
      $("info").classList.add("hidden");
    }
  });
</script>
</body>
</html>
