<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crea tu personaje — Mesa D&D</title>
<style>
  :root { --bg:#15121a; --card:#211c27; --card2:#2a2431; --line:#352d3e; --txt:#ede7f3; --mut:#a296b0; --acc:#d4a94e; --acc2:#8f6fd1; --ok:#5fbf7a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:14px 14px 90px; }
  .top { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .top h1 { font-size:1.1rem; margin:0; flex:1; }
  .prog { height:5px; background:var(--card2); border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .prog i { display:block; height:100%; background:var(--acc); transition:width .3s; }
  h2 { font-size:1.25rem; margin:6px 0 4px; }
  p.ayuda { color:var(--mut); margin:0 0 14px; font-size:.95rem; line-height:1.45; }
  .opciones { display:grid; gap:10px; }
  .op { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; text-align:left; color:var(--txt); font:inherit; width:100%; }
  .op.sel { border-color:var(--acc); background:#2b2416; }
  .op .t { font-weight:700; font-size:1.02rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .op .d { color:#cfc6da; font-size:.9rem; margin-top:4px; line-height:1.4; }
  .op .m { color:var(--mut); font-size:.8rem; margin-top:6px; }
  .tag { font-size:.68rem; padding:2px 7px; border-radius:20px; font-weight:700; background:var(--card2); color:var(--mut); }
  .tag.facil { background:#1f3a29; color:#8fe0a7; } .tag.media { background:#3a3220; color:#f0cf7a; } .tag.alta { background:#3a2026; color:#f08f9b; }
  .tag.rec { background:var(--acc); color:#1b1408; }
  .grande { display:grid; gap:12px; }
  .grande .op { padding:20px; } .grande .op .t { font-size:1.2rem; }
  .barra-nav { position:fixed; bottom:0; left:0; right:0; background:#1b1720; border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; justify-content:center; }
  .barra-nav > div { max-width:720px; width:100%; display:flex; gap:10px; }
  button.b { background:var(--card2); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:12px 16px; font-size:1rem; cursor:pointer; font-family:inherit; }
  button.p { background:var(--acc); color:#1b1408; border-color:var(--acc); font-weight:700; flex:1; }
  button.p:disabled { opacity:.4; }
  button.s { padding:8px 12px; font-size:.88rem; }
  .check { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .check.sel { border-color:var(--acc2); background:#2a2340; }
  .check.fija { opacity:.75; cursor:default; }
  .check input { width:20px; height:20px; accent-color:var(--acc2); }
  .check small { color:var(--mut); margin-left:auto; }
  .lista-checks { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; }
  .contador { color:var(--acc); font-weight:700; margin-bottom:10px; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--mut); margin-bottom:12px; }
  input.t, select { background:#120f16; color:var(--txt); border:1px solid var(--line); border-radius:9px; padding:10px; font-size:16px; font-family:inherit; width:100%; }
  .fila { display:flex; gap:8px; align-items:flex-end; } .fila > label { flex:1; margin-bottom:0; }
  .sub { margin-top:12px; padding:12px; background:var(--card2); border-radius:10px; }
  .sub h3 { margin:0 0 8px; font-size:.95rem; color:var(--acc); }

  /* Ficha */
  .ficha { background:#fbf8f2; color:#1d1a16; border-radius:12px; padding:18px; font-size:.92rem; }
  .ficha h2 { color:#1d1a16; margin:0; font-size:1.5rem; }
  .ficha .sub2 { color:#6b6157; margin:2px 0 12px; }
  .ficha h3 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:#8a5a12; margin:16px 0 6px; border-bottom:1px solid #e3d9c8; padding-bottom:3px; }
  .cars { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .car { border:1.5px solid #cbbfa9; border-radius:10px; text-align:center; padding:6px 2px; }
  .car .n { font-size:.68rem; font-weight:700; color:#6b6157; }
  .car .mod { font-size:1.35rem; font-weight:800; }
  .car .v { font-size:.75rem; color:#6b6157; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .st { border:1.5px solid #cbbfa9; border-radius:10px; text-align:center; padding:6px 2px; }
  .st b { display:block; font-size:1.25rem; } .st span { font-size:.68rem; color:#6b6157; font-weight:700; }
  .dos { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .ficha ul { margin:0; padding-left:18px; } .ficha li { margin:3px 0; line-height:1.35; }
  .hab { display:grid; grid-template-columns:1fr auto; gap:1px 8px; font-size:.85rem; }
  .hab .c { font-weight:700; } .hab .no { color:#8b8178; }
  table.armas { width:100%; border-collapse:collapse; font-size:.85rem; }
  table.armas th { text-align:left; font-size:.7rem; color:#6b6157; } table.armas td { padding:3px 2px; border-top:1px solid #eee4d3; }
  .nota { font-size:.78rem; color:#6b6157; margin-top:12px; }
  .acciones { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  @media (max-width:520px) { .cars { grid-template-columns:repeat(3,1fr); } .dos { grid-template-columns:1fr; } }
  @media print {
    body, html { background:#fff; } .no-print, .barra-nav, .top, .prog { display:none !important; }
    main { padding:0; max-width:none; } .ficha { border-radius:0; padding:0; font-size:10.5pt; }
    .cars { grid-template-columns:repeat(6,1fr); } .dos { grid-template-columns:1fr 1fr; }
  }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--card2); border:1px solid var(--acc); padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; }
  .toast.on { opacity:1; }
</style>
</head>
<body>
<main>
  <div class="top"><h1>🧙 Crea tu personaje</h1><span id="paso-txt" style="color:var(--mut);font-size:.85rem"></span></div>
  <div class="prog"><i id="prog"></i></div>
  <div id="vista"></div>
</main>
<div class="barra-nav no-print" id="nav"><div>
  <button class="b" id="atras">← Atrás</button>
  <button class="b p" id="sig">Siguiente →</button>
</div></div>
<div class="toast" id="toast"></div>

/* ============================ ESTADO ============================ */
const al = arr => arr[Math.floor(Math.random() * arr.length)];
const mod = v => Math.floor((v - 10) / 2);
const fmt = n => (n >= 0 ? "+" : "") + n;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let P = {};      // personaje en construcción
let paso = 0;
const PASOS = ["inicio","clase","especie","trasfondo","habilidades","equipo","detalles","ficha"];

function incrementos(clase, bg) {
  const C = CLASES[clase];
  if (bg === C.bg) return { ...C.inc };
  // Regla general: +2 a la característica más alta de las del trasfondo; +1 a otra (preferimos una impar, que sube el modificador).
  const base = Object.fromEntries(CAR.map((k, i) => [k, C.arr[i]]));
  const ops = [...TRASFONDOS[bg].cars].sort((a, b) => base[b] - base[a]);
  const inc = { [ops[0]]: 2 };
  const resto = ops.slice(1).sort((a, b) => (base[b] % 2) - (base[a] % 2) || base[b] - base[a]);
  inc[resto[0]] = 1;
  return inc;
}
function calcular() {
  const C = CLASES[P.clase], B = TRASFONDOS[P.bg], S = ESPECIES[P.especie];
  const inc = incrementos(P.clase, P.bg);
  const val = {}, m = {};
  CAR.forEach((k, i) => { val[k] = C.arr[i] + (inc[k] || 0); m[k] = mod(val[k]); });
  const eqKey = (C.eq[P.opEq] ? P.opEq : "A");
  const eq = C.eq[eqKey];
  const ctx = { ...m, _eq: eq };
  const pb = 2;
  const habs = new Set([...B.hab, ...P.habs, ...(P.habExtra || [])]);
  const subTxt = S.sub ? S.sub.ops[P.sub] : null;
  const pg = C.dg + m.CON + (S.pgExtra || 0);
  const ini = m.DES + (P.bg === "criminal" ? pb : 0);
  const vel = (P.especie === "elfo" && P.sub === "Elfo de los bosques") ? 35 : S.vel;
  const armas = eq.armas.map(k => {
    const [n, dado, tipo, prop] = A[k];
    let car = "FUE";
    if (prop === "dist") car = "DES";
    else if (prop === "sutil" || eq.monje) car = m.DES > m.FUE ? "DES" : "FUE";
    let atq = pb + m[car];
    if (prop === "dist" && eq.estilo === "arquería") atq += 2;
    const extra = prop === "arroj" ? " (arrojadiza)" : prop === "dist" ? " (distancia)" : prop === "sutil" ? " (sutil)" : "";
    return { n: n + extra, atq, dmg: `${dado}${m[car] ? fmt(m[car]) : ""} ${tipo}` };
  });
  if (eq.monje) armas.push({ n:"Golpe sin armas", atq: pb + Math.max(m.DES, m.FUE), dmg: `1d6${fmt(Math.max(m.DES, m.FUE))} contundente` });
  const mag = C.magia ? { ...C.magia, cd: 8 + pb + m[C.magia.car], atq: pb + m[C.magia.car] } : null;
  return { C, B, S, val, m, inc, eq, pb, habs, subTxt, pg, ini, vel, ca: eq.ca(ctx), armas, mag,
           rasgos: [...C.rasgos(ctx), B.dote, ...S.rasgos(P.especie === "draconido" ? subTxt : subTxt)],
           percPas: 10 + m.SAB + (habs.has("Percepción") ? pb : 0) };
}

/* ============================ ALEATORIO ============================ */
function aleatorio() {
  const clase = al(Object.keys(CLASES)), especie = al(Object.keys(ESPECIES));
  const C = CLASES[clase], S = ESPECIES[especie];
  P = { modo:"azar", clase, especie, bg:C.bg, opEq: C.eq.B && Math.random() < .5 ? "B" : "A",
        sub: S.sub ? al(Object.keys(S.sub.ops)) : null };
  const fijas = TRASFONDOS[P.bg].hab;
  const libres = C.hab[1].filter(h => !fijas.includes(h));
  P.habs = libres.sort(() => Math.random() - .5).slice(0, C.hab[0]);
  if (S.habExtra) P.habExtra = [al(S.habExtra.de.filter(h => !fijas.includes(h) && !P.habs.includes(h)))];
  P.nombre = `${al(NOMBRES)} ${al(APODOS)}`; P.jugador = P.jugador || "";
  P.motivo = al(MOTIVOS); P.rasgo = al(RASGOS_P); P.apariencia = al(APARIENCIAS);
}

      </div>
      <h3>Rasgos y dotes</h3><ul>${R.rasgos.map(r => `<li>${r}</li>`).join("")}</ul>
      <h3>Equipo</h3><ul><li>${R.eq.txt}</li><li>Del trasfondo (${R.B.n.toLowerCase()}): su paquete de equipo o 50 po. Herramienta: ${R.B.herr}.</li></ul>
      ${P.motivo || P.rasgo || P.apariencia ? `<h3>Personalidad</h3><ul>${P.motivo ? `<li><b>Motivación:</b> ${esc(P.motivo)}</li>` : ""}${P.rasgo ? `<li><b>Rasgo:</b> ${esc(P.rasgo)}</li>` : ""}${P.apariencia ? `<li><b>Apariencia:</b> ${esc(P.apariencia)}</li>` : ""}</ul>` : ""}
      <p class="nota">Basado en el SRD 5.2.1 de Wizards of the Coast LLC (CC-BY-4.0). Traducción y adaptación propias.</p>
    </div>
    <div class="acciones no-print">
      <button class="b" data-accion="imprimir">🖨️ Imprimir / PDF</button>
      <button class="b" data-accion="grupo">🛡️ Agregar al grupo del DM</button>
      <button class="b" data-accion="nuevo">✨ Crear otro</button>
    </div>`;
  },
};

function puedeSeguir() {
  const v = PASOS[paso];
  if (v === "clase") return !!P.clase;
  if (v === "especie") return !!P.especie && (!ESPECIES[P.especie].sub || !!P.sub);
  if (v === "trasfondo") return !!P.bg;
  if (v === "habilidades") {
    const S = ESPECIES[P.especie];
    return P.habs.length === CLASES[P.clase].hab[0] && (!S.habExtra || !!P.habExtra?.[0]);
  }
  if (v === "detalles") return !!(P.nombre || "").trim();
  return true;
}
function pintar() {
  const v = PASOS[paso];
  $("#vista").innerHTML = VISTAS[v]();
  const total = PASOS.length - 2;
  $("#prog").style.width = (v === "inicio" ? 0 : v === "ficha" ? 100 : (paso / (total + 1)) * 100) + "%";
  $("#paso-txt").textContent = v === "inicio" || v === "ficha" ? "" : `Paso ${paso} de ${total}`;
  $("#nav").style.display = v === "inicio" ? "none" : "";
  $("#sig").style.display = v === "ficha" ? "none" : "";
  $("#atras").textContent = v === "ficha" && P.modo === "azar" ? "← Inicio" : "← Atrás";
  $("#sig").textContent = PASOS[paso + 1] === "ficha" ? "Ver mi ficha ✓" : "Siguiente →";
  $("#sig").disabled = !puedeSeguir();
  window.scrollTo(0, 0);
}
function refrescarBoton() { $("#sig").disabled = !puedeSeguir(); }

/* ============================ EVENTOS ============================ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-ir],[data-set],[data-dado],[data-accion]");
  if (!t) return;
  if (t.dataset.ir === "azar") { aleatorio(); paso = PASOS.indexOf("ficha"); return pintar(); }
  if (t.dataset.ir === "elegir") { P = { modo:"elegir", habs:[] }; paso = 1; return pintar(); }
  if (t.dataset.set) {
    const k = t.dataset.set, v = t.dataset.v;
    if (k === "clase" && P.clase !== v) { P.clase = v; P.bg = CLASES[v].bg; P.habs = []; P.opEq = "A"; }
    if (k === "especie" && P.especie !== v) { P.especie = v; P.sub = ESPECIES[v].sub ? Object.keys(ESPECIES[v].sub.ops)[0] : null; P.habExtra = null; }
    if (k === "bg" && P.bg !== v) { P.bg = v; P.habs = P.habs.filter(h => !TRASFONDOS[v].hab.includes(h)); P.habExtra = null; }
    if (k === "opEq") P.opEq = v;
    const y = window.scrollY; pintar(); window.scrollTo(0, y); return;
  }
  if (t.dataset.dado) {
    const k = t.dataset.dado;
    const v = k === "nombre" ? `${al(NOMBRES)} ${al(APODOS)}` : al({ motivo:MOTIVOS, rasgo:RASGOS_P, apariencia:APARIENCIAS }[k]);
    P[k] = v; $("#d-" + k).value = v; refrescarBoton(); return;
  }
  const acc = t.dataset.accion;
  if (acc === "imprimir") window.print();
  if (acc === "nuevo") { P = {}; paso = 0; pintar(); }
  if (acc === "grupo") agregarAlGrupo();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.hab) {
    const h = t.dataset.hab, n = CLASES[P.clase].hab[0];
    if (t.checked) { if (P.habs.length >= n) { t.checked = false; return toast(`Solo puedes elegir ${n}. Quita otra primero.`); } P.habs.push(h); }
    else P.habs = P.habs.filter(x => x !== h);
    if (P.habExtra && P.habs.includes(P.habExtra[0])) P.habExtra = null;
    const y = window.scrollY; pintar(); window.scrollTo(0, y); return;
  }
  if (t.id === "sub") { P.sub = t.value; $("#sub-d").innerHTML = ESPECIES[P.especie].sub.ops[P.sub]; refrescarBoton(); }
  if (t.id === "habextra") { P.habExtra = t.value ? [t.value] : null; refrescarBoton(); }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id && id.startsWith("d-")) { P[id.slice(2)] = e.target.value; refrescarBoton(); }
});
$("#sig").onclick = () => { if (puedeSeguir()) { paso++; pintar(); } };
$("#atras").onclick = () => {
  if (PASOS[paso] === "ficha" && P.modo === "azar") { paso = 0; return pintar(); }
  paso = Math.max(0, paso - 1); pintar();
};

/* ===== Integración con el Panel DM (mismo dispositivo, mismo sitio) ===== */
function agregarAlGrupo() {
  const R = calcular();
  const CLAVE = "mesa-dnd-dm-v1";
  let E;
  try { E = JSON.parse(localStorage.getItem(CLAVE)) || { grupo:{}, combate:{ ronda:0, turno:0, lista:[] }, historial:[] }; }
  catch { E = { grupo:{}, combate:{ ronda:0, turno:0, lista:[] }, historial:[] }; }
  const id = Math.random().toString(36).slice(2, 10);
  const espacios = {};
  if (R.mag) espacios[1] = { max: P.clase === "brujo" ? 1 : 2, usados: 0 };
  E.grupo[id] = { id, nombre: P.nombre, jugador: P.jugador || "", clase: R.C.n, nivel: 1, pgMax: R.pg, pg: R.pg, pgTemp: 0,
                  ca: R.ca, bono: R.ini, espacios, notas: `${R.S.n} · ${R.B.n}` };
  try { localStorage.setItem(CLAVE, JSON.stringify(E)); toast("Agregado al grupo del Panel DM."); }
  catch { toast("No se pudo guardar en este dispositivo."); }
}

pintar();
</script>
</body>
</html>
