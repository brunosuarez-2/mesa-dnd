<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crea tu personaje — Mesa D&D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="estilos.css">
<style>
  main { max-width:760px; margin:0 auto; padding:0 16px 110px; }
  .top { display:flex; align-items:center; gap:12px; padding:20px 0 14px; border-bottom:1px solid rgba(195,160,106,.16); margin-bottom:18px; }
  .top .casa { color:var(--oro); display:inline-flex; padding:6px; border-radius:3px; }
  .top .casa:hover { background:rgba(0,0,0,.2); }
  .top h1 { flex:1; font-size:1.05rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--crema); }
  /* Progreso: cinta con marcas, como un marcapáginas */
  .progreso { display:flex; align-items:center; gap:10px; margin:2px 0 18px; }
  .prog { flex:1; height:2px; background:rgba(195,160,106,.18); overflow:hidden; }
  .prog i { display:block; height:100%; background:var(--oro); transition:width .3s; }
  #paso-txt { color:var(--crema-suave); font:500 .66rem var(--f-texto); letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; }
  /* Hoja del paso */
  .hoja { padding:30px 22px; }
  .hoja h2 { font-size:clamp(1.9rem, 6vw, 2.6rem); font-weight:500; margin-top:8px; }
  p.ayuda { color:var(--tinta-suave); margin:6px 0 18px; font-size:.98rem; }
  .opciones { display:grid; gap:12px; }
  .grande { display:grid; gap:14px; }
  .grande .opcion { padding:22px 22px 22px 76px; }
  .grande .opcion .sello { width:46px; height:46px; left:16px; top:20px; }
  .grande .opcion .t { font-size:1.75rem; }
  .estampa.facil { color:var(--bosque); } .estampa.media { color:var(--ambar-tinta); } .estampa.alta { color:var(--borgona); }
  .estampa.rec { color:var(--manuscrito); background:var(--borgona); border-color:var(--borgona); }
  /* Habilidades: casillas en el papel */
  .contador { font-weight:600; color:var(--borgona); margin-bottom:10px; }
  .lista-checks { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; }
  .check { display:flex; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; border-radius:var(--radio);
    background:var(--manuscrito); border:1px solid rgba(44,34,25,.16); color:var(--tinta); }
  .check:hover { border-color:rgba(44,34,25,.45); }
  .check.sel { border-color:var(--borgona); box-shadow:inset 0 0 0 1px var(--borgona); }
  .check.fija { cursor:default; opacity:.85; }
  .check small { color:var(--tinta-suave); margin-left:auto; font-size:.75rem; }
  .sub { margin-top:18px; padding:16px; border-top:1px solid rgba(44,34,25,.2); border-bottom:1px solid rgba(44,34,25,.2); }
  .sub h3 { font-size:1.35rem; margin-bottom:8px; }
  .sub select { width:100%; }
  label.f { display:flex; flex-direction:column; gap:6px; font:600 .66rem var(--f-texto); letter-spacing:.12em; text-transform:uppercase; color:var(--tinta-suave); margin-bottom:16px; }
  input.t { width:100%; }
  .fila-d { display:flex; gap:8px; align-items:flex-end; margin-bottom:14px; } .fila-d > label { flex:1; margin-bottom:0; }
  /* Barra inferior: tabla de madera */
  .barra-nav { position:fixed; bottom:0; left:0; right:0; z-index:5; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(20,16,12,.94); backdrop-filter:blur(6px); border-top:1px solid rgba(195,160,106,.2); }
  .barra-nav > div { max-width:760px; margin:0 auto; display:flex; gap:10px; }
  .barra-nav .btn.laton { flex:1; min-height:48px; }
  .acciones { display:flex; flex-wrap:wrap; gap:10px; margin:16px 0; }
  .sub-t { font:600 .66rem var(--f-texto); letter-spacing:.16em; text-transform:uppercase; color:var(--borgona); margin:22px 0 10px; display:flex; justify-content:space-between; }
  .sub-t .cuenta { color:var(--tinta); }
  .opcion.conj { padding:14px 16px; }
  .opcion.conj .d { font-size:.88rem; }

  /* ===== Ficha de personaje: documento ===== */
  .ficha { padding:34px 26px; font-size:.93rem; background:var(--fibras), var(--manuscrito); }
  .ficha .encab { display:flex; gap:16px; align-items:center; border-bottom:1px solid rgba(44,34,25,.5); padding-bottom:16px; margin-bottom:8px; }
  .ficha .encab .sello { width:54px; height:54px; font-size:1.6rem; }
  .ficha h2 { font-size:2.3rem; font-weight:500; }
  .ficha .sub2 { color:var(--tinta-suave); font-size:.9rem; }
  .ficha h3 { font-family:var(--f-texto); font-size:.64rem; font-weight:600; text-transform:uppercase; letter-spacing:.18em; color:var(--borgona);
    margin:18px 0 8px; display:flex; align-items:center; gap:8px; }
  .ficha h3::after { content:""; flex:1; height:1px; background:rgba(112,59,58,.35); }
  .cars { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .car { text-align:center; padding:10px 2px 8px; border:1px solid rgba(44,34,25,.3); background:var(--manuscrito); }
  .car .n { font-size:.66rem; font-weight:700; letter-spacing:.06em; color:var(--tinta-suave); }
  .car .mod { font-family:var(--f-titulo); font-size:1.9rem; font-weight:500; line-height:1.1; }
  .car .v { display:inline-block; font-size:.72rem; color:var(--tinta-suave); margin-top:2px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .st { text-align:center; padding:10px 4px; border:1px solid rgba(44,34,25,.22); }
  .st b { display:block; font-family:var(--f-titulo); font-size:1.7rem; font-weight:500; line-height:1.1; }
  .st span { font-size:.64rem; font-weight:700; letter-spacing:.05em; color:var(--tinta-suave); text-transform:uppercase; }
  .st.clave { border-color:var(--borgona); box-shadow:inset 0 0 0 1px var(--borgona); }
  .dos { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .ficha ul { margin:0; padding-left:18px; } .ficha li { margin:4px 0; line-height:1.45; }
  .hab { display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-size:.86rem; }
  .hab .c { font-weight:700; } .hab .no { color:var(--tinta-suave); }
  .hab small { color:var(--tinta-suave); font-weight:400; }
  table.armas { width:100%; border-collapse:collapse; font-size:.88rem; }
  table.armas th { text-align:left; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-suave); padding:4px 2px; }
  table.armas td { padding:6px 2px; border-top:1px solid rgba(89,65,47,.25); }
  .nota { font-size:.75rem; color:var(--tinta-suave); margin-top:16px; }
  @media (max-width:560px) { .cars { grid-template-columns:repeat(3,1fr); } .dos { grid-template-columns:1fr; } .stats { grid-template-columns:repeat(2,1fr); } }
  @media print {
    html, body { background:#fff !important; } .no-print, .barra-nav, .top, .progreso, #sprite-iconos { display:none !important; }
    main { padding:0; max-width:none; } .ficha { box-shadow:none !important; background:#fff !important; padding:0; font-size:10.5pt; }
    .cars { grid-template-columns:repeat(6,1fr); } .dos { grid-template-columns:1fr 1fr; } .stats { grid-template-columns:repeat(4,1fr); }
  }
</style>
</head>

  "Intimidación":"CAR","Investigación":"INT","Juego de manos":"DES","Medicina":"SAB","Naturaleza":"INT","Percepción":"SAB",

const A = {
  granhacha:["Gran hacha","1d12","cortante",""], hachamano:["Hacha de mano","1d6","cortante","arroj"],
  daga:["Daga","1d4","perforante","sutil"], maza:["Maza","1d6","contundente",""], hoz:["Hoz","1d4","cortante",""],
  baston:["Bastón","1d6","contundente",""], espadon:["Espadón","2d6","cortante",""], mayal:["Mayal","1d8","contundente",""],
  jabalina:["Jabalina","1d6","perforante","arroj"], cimitarra:["Cimitarra","1d6","cortante","sutil"],
  espadacorta:["Espada corta","1d6","perforante","sutil"], arcolargo:["Arco largo","1d8","perforante","dist"],

const CLASES = {
  barbaro: { n:"Bárbaro", dg:12, comp:"facil", salv:["FUE","CON"], hab:[2,["Trato con animales","Atletismo","Intimidación","Naturaleza","Percepción","Supervivencia"]],
    arr:[15,13,14,10,12,8], bg:"soldado", inc:{FUE:2,CON:1},
    d:"Un guerrero feroz que entra en furia y aguanta golpes que tumbarían a cualquiera.", gusta:"te gusta ir al frente y pegar fuerte",
    eq:{ A:{ txt:"Gran hacha, 4 hachas de mano, paquete de explorador y 15 po", armas:["granhacha","hachamano"], ca:c=>10+c.DES+c.CON } },
    rasgos:c=>["<b>Furia</b> (2 usos; acción adicional): +2 al daño con ataques de Fuerza, resistencia al daño contundente, cortante y perforante, y ventaja en pruebas y salvaciones de Fuerza. Recuperas 1 uso con descanso corto y todos con descanso largo.",

      "<b>Lanzamiento de conjuros</b> (Sabiduría): 2 trucos y 4 conjuros preparados de la lista de druida."] },

const al = arr => arr[Math.floor(Math.random() * arr.length)];
const mod = v => Math.floor((v - 10) / 2);
const fmt = n => (n >= 0 ? "+" : "") + n;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const PASOS_F = () => PASOS_BASE.filter(x => x !== "conjuros" || lanzaConjuros());
// Siempre preparados por rasgo de clase (no cuentan en el límite)
const SIEMPRE = { druida: ["hablar-animales"], explorador: ["marca-cazador"] };

function incrementos(clase, bg) {
  const C = CLASES[clase];
  if (bg === C.bg) return { ...C.inc };
  // Regla general: +2 a la característica más alta de las del trasfondo; +1 a otra (preferimos una impar, que sube el modificador).
  const base = Object.fromEntries(CAR.map((k, i) => [k, C.arr[i]]));
  const ops = [...TRASFONDOS[bg].cars].sort((a, b) => base[b] - base[a]);
  const inc = { [ops[0]]: 2 };
  const resto = ops.slice(1).sort((a, b) => (base[b] % 2) - (base[a] % 2) || base[b] - base[a]);
  inc[resto[0]] = 1;
  return inc;
}
function calcular() {
  const C = CLASES[P.clase], B = TRASFONDOS[P.bg], S = ESPECIES[P.especie];
  const inc = incrementos(P.clase, P.bg);
  const val = {}, m = {};
  CAR.forEach((k, i) => { val[k] = C.arr[i] + (inc[k] || 0); m[k] = mod(val[k]); });
  const eqKey = (C.eq[P.opEq] ? P.opEq : "A");
  const eq = C.eq[eqKey];
  const ctx = { ...m, _eq: eq };
  const pb = 2;
  const habs = new Set([...B.hab, ...P.habs, ...(P.habExtra || [])]);
  const subTxt = S.sub ? S.sub.ops[P.sub] : null;
  const pg = C.dg + m.CON + (S.pgExtra || 0);
  const ini = m.DES + (P.bg === "criminal" ? pb : 0);
  const vel = (P.especie === "elfo" && P.sub === "Elfo de los bosques") ? 35 : S.vel;
  const armas = eq.armas.map(k => {
    const [n, dado, tipo, prop] = A[k];
    let car = "FUE";
    if (prop === "dist") car = "DES";
    else if (prop === "sutil" || eq.monje) car = m.DES > m.FUE ? "DES" : "FUE";
    let atq = pb + m[car];
    if (prop === "dist" && eq.estilo === "arquería") atq += 2;
    const extra = prop === "arroj" ? " (arrojadiza)" : prop === "dist" ? " (distancia)" : prop === "sutil" ? " (sutil)" : "";
    return { n: n + extra, atq, dmg: `${dado}${m[car] ? fmt(m[car]) : ""} ${tipo}` };
  });
  if (eq.monje) armas.push({ n:"Golpe sin armas", atq: pb + Math.max(m.DES, m.FUE), dmg: `1d6${fmt(Math.max(m.DES, m.FUE))} contundente` });
  const mag = C.magia ? { ...C.magia, cd: 8 + pb + m[C.magia.car], atq: pb + m[C.magia.car] } : null;
  return { C, B, S, val, m, inc, eq, pb, habs, subTxt, pg, ini, vel, ca: eq.ca(ctx), armas, mag,
           rasgos: [...C.rasgos(ctx), B.dote, ...S.rasgos(P.especie === "draconido" ? subTxt : subTxt)],
           percPas: 10 + m.SAB + (habs.has("Percepción") ? pb : 0) };
}

/* ============================ ALEATORIO ============================ */
function aleatorio() {
  const clase = al(Object.keys(CLASES)), especie = al(Object.keys(ESPECIES));
  const C = CLASES[clase], S = ESPECIES[especie];
  P = { modo:"azar", clase, especie, bg:C.bg, opEq: C.eq.B && Math.random() < .5 ? "B" : "A",
        sub: S.sub ? al(Object.keys(S.sub.ops)) : null };
  const fijas = TRASFONDOS[P.bg].hab;
  const libres = C.hab[1].filter(h => !fijas.includes(h));
  P.habs = libres.sort(() => Math.random() - .5).slice(0, C.hab[0]);
  if (S.habExtra) P.habExtra = [al(S.habExtra.de.filter(h => !fijas.includes(h) && !P.habs.includes(h)))];
  P.trucos = []; P.prep = [];
  if (C.magia) {
    const mezclar = a => [...a].sort(() => Math.random() - .5);
    P.trucos = mezclar(conjurosDeClase(clase, 0)).slice(0, C.magia.trucos || 0).map(s => s.id);
    P.prep = mezclar(conjurosDeClase(clase, 1).filter(s => !(SIEMPRE[clase] || []).includes(s.id))).slice(0, C.magia.prep).map(s => s.id);
  }
  P.nombre = `${al(NOMBRES)} ${al(APODOS)}`; P.jugador = P.jugador || "";
  P.motivo = al(MOTIVOS); P.rasgo = al(RASGOS_P); P.apariencia = al(APARIENCIAS);
}

      <p class="ayuda">Los <b>trucos</b> los lanzas cuantas veces quieras. Los <b>conjuros de nivel 1</b> gastan un espacio de conjuro (tienes ${M.esp}); se recuperan con un descanso largo.${P.clase === "mago" ? " Como mago, estos son los que preparas de tu libro." : ""}</p>
      ${siempre.length ? `<p class="ayuda">Además siempre tienes preparado: <b>${siempre.map(i => CONJUROS[i].n).join(", ")}</b> (no cuenta en el límite).</p>` : ""}
      ${M.trucos ? `<h3 class="sub-t">Trucos · elige ${M.trucos} <span class="cuenta">${P.trucos.length}/${M.trucos}</span></h3><div class="opciones">${trucos.map(s => tarjeta(s, "trucos", M.trucos)).join("")}</div>` : ""}
      <h3 class="sub-t">Conjuros de nivel 1 · elige ${M.prep} <span class="cuenta">${P.prep.length}/${M.prep}</span></h3>
      <div class="opciones">${nv1.map(s => tarjeta(s, "prep", M.prep)).join("")}</div>
      <p class="ayuda" style="margin-top:14px">No te preocupes por elegir perfecto: con tu DM podrás cambiarlos más adelante.</p>
    </section>`;
  },
  detalles: () => `
    <section class="pergamino hoja">
      <span class="eyebrow">${lanzaConjuros() ? "Paso 7" : "Paso 6"} · Personalidad</span>
      <h2>Dale vida a tu personaje</h2>
      <p class="ayuda">Esto no cambia los números, pero hace la historia más divertida. Usa el dado para tomar ideas al azar.</p>
      <div class="fila-d"><label class="f">Nombre<input class="t" id="d-nombre" value="${esc(P.nombre || "")}"></label><button class="btn tinta" data-dado="nombre" aria-label="Nombre al azar">${ico("dado")}</button></div>
      <label class="f">Tu nombre (jugador)<input class="t" id="d-jugador" value="${esc(P.jugador || "")}"></label>
      <div class="fila-d"><label class="f">¿Por qué te aventuras?<input class="t" id="d-motivo" value="${esc(P.motivo || "")}"></label><button class="btn tinta" data-dado="motivo" aria-label="Motivo al azar">${ico("dado")}</button></div>
      <div class="fila-d"><label class="f">Rasgo de personalidad<input class="t" id="d-rasgo" value="${esc(P.rasgo || "")}"></label><button class="btn tinta" data-dado="rasgo" aria-label="Rasgo al azar">${ico("dado")}</button></div>
      <div class="fila-d"><label class="f">Detalle de apariencia<input class="t" id="d-apariencia" value="${esc(P.apariencia || "")}"></label><button class="btn tinta" data-dado="apariencia" aria-label="Apariencia al azar">${ico("dado")}</button></div>
    </section>`,
  ficha: () => {
    const R = calcular();
    const salv = CAR.map(k => `<div class="${R.C.salv.includes(k) ? "c" : "no"}">${R.C.salv.includes(k) ? "●" : "○"} ${CAR_N[k]}</div><div>${fmt(R.m[k] + (R.C.salv.includes(k) ? R.pb : 0))}</div>`).join("");
    const habs = TODAS.map(h => { const c = R.habs.has(h); return `<div class="${c ? "c" : "no"}">${c ? "●" : "○"} ${h} <small>(${HAB[h]})</small></div><div>${fmt(R.m[HAB[h]] + (c ? R.pb : 0))}</div>`; }).join("");
    return `
    ${P.modo === "azar" ? `<div class="acciones no-print"><button class="btn laton" data-ir="azar">${ico("reiniciar")} Volver a tirar</button></div>` : ""}
    <article class="pergamino ficha" id="ficha">
      <div class="encab"><span class="sello">${esc((P.nombre || "?")[0])}</span><div>
        <h2>${esc(P.nombre || "Sin nombre")}</h2>
        <div class="sub2">${R.C.n} nivel 1 · ${R.S.n}${P.sub ? ` (${P.sub})` : ""} · ${R.B.n}${P.jugador ? ` · Jugador: ${esc(P.jugador)}` : ""}</div></div></div>
      <h3>Características</h3>
      <div class="cars">${CAR.map(k => `<div class="car"><div class="n">${CAR_N[k].toUpperCase()}</div><div class="mod">${fmt(R.m[k])}</div><div class="v">${R.val[k]}</div></div>`).join("")}</div>
      <h3>Combate</h3>
      <div class="stats">
        <div class="st clave"><b>${R.ca}</b><span>Clase de armadura</span></div><div class="st clave"><b>${R.pg}</b><span>Puntos de golpe</span></div>
        <div class="st"><b>${fmt(R.ini)}</b><span>Iniciativa</span></div><div class="st"><b>${R.vel}</b><span>Velocidad (pies)</span></div>
        <div class="st"><b>+${R.pb}</b><span>Competencia</span></div><div class="st"><b>d${R.C.dg}</b><span>Dado de golpe</span></div>
        <div class="st"><b>${R.percPas}</b><span>Percepción pasiva</span></div><div class="st"><b>${R.mag ? R.mag.cd : "—"}</b><span>CD de conjuros</span></div>
      </div>
      <h3>Ataques</h3>
      <table class="armas"><tr><th>Arma</th><th>Ataque</th><th>Daño</th></tr>${R.armas.map(a => `<tr><td>${a.n}</td><td><b>${fmt(a.atq)}</b></td><td>${a.dmg}</td></tr>`).join("")}</table>
      ${R.mag ? `<h3>Magia</h3><ul><li>Característica: <b>${CAR_N[R.mag.car]}</b> · CD de salvación <b>${R.mag.cd}</b> · Ataque de conjuro <b>${fmt(R.mag.atq)}</b></li>
        <li>${R.mag.trucos ? `<b>${R.mag.trucos}</b> trucos · ` : ""}<b>${R.mag.prep}</b> conjuros preparados · Espacios: ${R.mag.esp}</li>
        ${(P.trucos || []).length ? `<li><b>Trucos:</b> ${P.trucos.map(i => CONJUROS[i].n).join(", ")}</li>` : ""}
        <li><b>Preparados:</b> ${[...(SIEMPRE[P.clase] || []), ...(P.prep || [])].map(i => CONJUROS[i].n).join(", ") || "—"}</li></ul>` : ""}
      <div class="dos">
        <div><h3>Salvaciones</h3><div class="hab">${salv}</div></div>
        <div><h3>Habilidades</h3><div class="hab">${habs}</div></div>
      </div>
      <h3>Rasgos y dotes</h3><ul>${R.rasgos.map(r => `<li>${r}</li>`).join("")}</ul>
      <h3>Equipo</h3><ul><li>${R.eq.txt}</li><li>Del trasfondo (${R.B.n.toLowerCase()}): su paquete de equipo o 50 po. Herramienta: ${R.B.herr}.</li></ul>
      ${P.motivo || P.rasgo || P.apariencia ? `<h3>Personalidad</h3><ul>${P.motivo ? `<li><b>Motivación:</b> ${esc(P.motivo)}</li>` : ""}${P.rasgo ? `<li><b>Rasgo:</b> ${esc(P.rasgo)}</li>` : ""}${P.apariencia ? `<li><b>Apariencia:</b> ${esc(P.apariencia)}</li>` : ""}</ul>` : ""}
      <p class="nota">Basado en el SRD 5.2.1 de Wizards of the Coast LLC (CC-BY-4.0). Traducción y adaptación propias.</p>
    </article>
    <div class="acciones no-print">
      ${MESA ? `<button class="btn laton" data-accion="mesa">${ico("check")} Unirme a la mesa ${esc(MESA)} con este personaje</button>` : ""}
      <button class="btn" data-accion="imprimir">${ico("imprimir")} Imprimir o guardar PDF</button>
      ${MESA ? "" : `<button class="btn" data-accion="grupo">${ico("escudo")} Agregar al grupo del DM</button>`}
      <button class="btn" data-accion="nuevo">${ico("mas")} Crear otro</button>
    </div>`;
  },
};

function puedeSeguir() {
  const v = PASOS_F()[paso];
  if (v === "clase") return !!P.clase;
  if (v === "especie") return !!P.especie && (!ESPECIES[P.especie].sub || !!P.sub);
  if (v === "trasfondo") return !!P.bg;
  if (v === "habilidades") {
    const S = ESPECIES[P.especie];
    return P.habs.length === CLASES[P.clase].hab[0] && (!S.habExtra || !!P.habExtra?.[0]);
  }
  if (v === "conjuros") { const M = CLASES[P.clase].magia; return P.trucos.length === (M.trucos || 0) && P.prep.length === M.prep; }
  if (v === "detalles") return !!(P.nombre || "").trim();
  return true;
}
function pintar() {
  const v = PASOS_F()[paso];
  $("#vista").innerHTML = VISTAS[v]();
  const total = PASOS_F().length - 2;
  $("#prog").style.width = (v === "inicio" ? 0 : v === "ficha" ? 100 : (paso / (total + 1)) * 100) + "%";
  $("#paso-txt").textContent = v === "inicio" || v === "ficha" ? "" : `Paso ${paso} de ${total}`;
  $("#nav").style.display = v === "inicio" ? "none" : "";
  $("#sig").style.display = v === "ficha" ? "none" : "";
  $("#atras").innerHTML = ico("anterior") + (v === "ficha" && P.modo === "azar" ? " Inicio" : " Atrás");
  $("#sig").innerHTML = PASOS_F()[paso + 1] === "ficha" ? `Ver mi ficha ${ico("check")}` : `Siguiente ${ico("siguiente")}`;
  $("#sig").disabled = !puedeSeguir();
  window.scrollTo(0, 0);
}
function refrescarBoton() { $("#sig").disabled = !puedeSeguir(); }

/* ============================ EVENTOS ============================ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-ir],[data-set],[data-dado],[data-accion],[data-conj]");
  if (!t) return;
  if (t.dataset.conj) {
    const L = P[t.dataset.lista], id = t.dataset.conj, max = +t.dataset.max;
    if (L.includes(id)) L.splice(L.indexOf(id), 1);
    else { if (L.length >= max) return toast(`Ya elegiste ${max}. Quita uno primero.`); L.push(id); }
    const y = window.scrollY; pintar(); window.scrollTo(0, y); return;
  }
  if (t.dataset.ir === "azar") { aleatorio(); paso = PASOS_F().indexOf("ficha"); return pintar(); }
  if (t.dataset.ir === "elegir") { P = { modo:"elegir", habs:[], trucos:[], prep:[] }; paso = 1; return pintar(); }
  if (t.dataset.set) {
    const k = t.dataset.set, v = t.dataset.v;
    if (k === "clase" && P.clase !== v) { P.clase = v; P.bg = CLASES[v].bg; P.habs = []; P.opEq = "A"; P.trucos = []; P.prep = []; }
    if (k === "especie" && P.especie !== v) { P.especie = v; P.sub = ESPECIES[v].sub ? Object.keys(ESPECIES[v].sub.ops)[0] : null; P.habExtra = null; }
    if (k === "bg" && P.bg !== v) { P.bg = v; P.habs = P.habs.filter(h => !TRASFONDOS[v].hab.includes(h)); P.habExtra = null; }
    if (k === "opEq") P.opEq = v;
    const y = window.scrollY; pintar(); window.scrollTo(0, y); return;
  }
  if (t.dataset.dado) {
    const k = t.dataset.dado;
    const v = k === "nombre" ? `${al(NOMBRES)} ${al(APODOS)}` : al({ motivo:MOTIVOS, rasgo:RASGOS_P, apariencia:APARIENCIAS }[k]);
    P[k] = v; $("#d-" + k).value = v; refrescarBoton(); return;
  }
  const acc = t.dataset.accion;
  if (acc === "imprimir") window.print();
  if (acc === "nuevo") { P = {}; paso = 0; pintar(); }
  if (acc === "grupo") agregarAlGrupo();
  if (acc === "mesa") unirseMesa(t);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.hab) {
    const h = t.dataset.hab, n = CLASES[P.clase].hab[0];
    if (t.checked) { if (P.habs.length >= n) { t.checked = false; return toast(`Solo puedes elegir ${n}. Quita otra primero.`); } P.habs.push(h); }
    else P.habs = P.habs.filter(x => x !== h);
    if (P.habExtra && P.habs.includes(P.habExtra[0])) P.habExtra = null;
    const y = window.scrollY; pintar(); window.scrollTo(0, y); return;
  }
  if (t.id === "sub") { P.sub = t.value; $("#sub-d").innerHTML = ESPECIES[P.especie].sub.ops[P.sub]; refrescarBoton(); }
  if (t.id === "habextra") { P.habExtra = t.value ? [t.value] : null; refrescarBoton(); }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id && id.startsWith("d-")) { P[id.slice(2)] = e.target.value; refrescarBoton(); }
});
$("#sig").onclick = () => { if (puedeSeguir()) { paso++; pintar(); } };
$("#atras").onclick = () => {
  if (PASOS_F()[paso] === "ficha" && P.modo === "azar") { paso = 0; return pintar(); }
  paso = Math.max(0, paso - 1); pintar();
};

/* ===== Ficha completa del personaje (formato compartido con el Panel DM y la hoja del jugador) ===== */
const MESA = (new URLSearchParams(location.search).get("m") || "").toUpperCase();
function construirPJ() {
  const R = calcular();
  const espacios = {};
  if (R.mag) espacios[1] = { max: P.clase === "brujo" ? 1 : 2, usados: 0 };
  const po = num((R.eq.txt.match(/(\d+)\s*po/) || [])[1]);
  return {
    id: Math.random().toString(36).slice(2, 10),
    nombre: P.nombre || "Sin nombre", jugador: P.jugador || "", clase: R.C.n, nivel: 1,
    ca: R.ca, bono: R.ini, pgMax: R.pg, pg: R.pg, pgTemp: 0, espacios,
    notas: `${R.S.n} · ${R.B.n}`, muerte: { ok: 0, ko: 0 }, agot: 0, conc: false, insp: false,
    dg: { max: 1, usados: 0 }, monedas: { po, pp: 0, pc: 0 },
    conjuros: R.mag ? { trucos: [...(P.trucos || [])], preparados: [...(P.prep || [])], siempre: [...(SIEMPRE[P.clase] || [])] } : null,
    inventario: `${R.eq.txt}\nDel trasfondo (${R.B.n.toLowerCase()}): su paquete de equipo. Herramienta: ${R.B.herr}.`,
    ficha: {
      especie: R.S.n + (P.sub ? ` (${P.sub})` : ""), trasfondo: R.B.n, vel: R.vel, pb: R.pb, dgDado: R.C.dg, percPas: R.percPas,
      cars: Object.fromEntries(CAR.map(k => [k, { nom: CAR_N[k], v: R.val[k], m: R.m[k] }])),
      salv: CAR.map(k => ({ n: CAR_N[k], comp: R.C.salv.includes(k), b: R.m[k] + (R.C.salv.includes(k) ? R.pb : 0) })),
      habs: TODAS.map(h => ({ n: h, car: HAB[h], comp: R.habs.has(h), b: R.m[HAB[h]] + (R.habs.has(h) ? R.pb : 0) })),
      armas: R.armas,
      magia: R.mag ? { car: R.mag.car, cd: R.mag.cd, atq: R.mag.atq, trucos: R.mag.trucos, prep: R.mag.prep, esp: R.mag.esp } : null,
      rasgos: R.rasgos, equipo: [R.eq.txt],
      personalidad: { motivo: P.motivo || "", rasgo: P.rasgo || "", apariencia: P.apariencia || "" },
    },
  };
}
function num(v, def = 0) { const n = parseInt(v, 10); return Number.isFinite(n) ? n : def; }

/* Mismo dispositivo: lo agrega al grupo local del Panel DM */
function agregarAlGrupo() {
  const CLAVE = "mesa-dnd-dm-v1";
  let E;
  try { E = JSON.parse(localStorage.getItem(CLAVE)) || null; } catch { E = null; }
  E = E || { grupo:{}, combate:{ ronda:0, turno:0, lista:[] }, historial:[], aventura:null, kit:[] };
  const pj = construirPJ();
  E.grupo[pj.id] = pj;
  try { localStorage.setItem(CLAVE, JSON.stringify(E)); toast("Agregado al grupo del Panel DM."); }
  catch { toast("No se pudo guardar en este dispositivo."); }
}

/* En línea: se une a la mesa del DM con este personaje */
async function unirseMesa(boton) {
  if (!window.Nube) return toast(window.NubeError ? "Sin conexión: necesitas internet para unirte." : "Conectando… inténtalo en un segundo.");
  boton.disabled = true;
  try {
    const u = await Nube.entrarAnonimo();
    const mesaId = await Nube.leer(`codigos/${MESA}`);
    if (!mesaId) { boton.disabled = false; return toast("Ese código de mesa no existe."); }
    const pj = construirPJ(); pj.jugadorUid = u.uid;
    await Nube.escribir(`mesas/${mesaId}/personajes/${pj.id}`, pj);
    await Nube.escribir(`mesas/${mesaId}/jugadores/${u.uid}`, { nombre: P.jugador || P.nombre || "Jugador", pj: pj.id });
    location.href = `jugador.html?m=${encodeURIComponent(MESA)}`;
  } catch (e) { console.error(e); boton.disabled = false; toast("No se pudo unir a la mesa. Revisa tu conexión."); }
}

$("#lectura").innerHTML = botonLectura();
pintar();
</script>
